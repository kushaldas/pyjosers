[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "pyjosers"
version = "0.3.0"
description = "Rust-backed JOSE with a familiar jwcrypto-style Python API"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3", "Topic :: Security :: Cryptography"]

[project.urls]
Documentation = "https://pyjosers.readthedocs.org/"
Repository = "https://github.com/kushaldas/pyjosers"

[project.optional-dependencies]
dev = ["pytest>=9.2", "jwcrypto>=1.6.1", "pyjosers[docs]", "maturin>=1.16,<2"]
docs = [
    "sphinx>=9.2; python_version >= '3.13'",
    "sphinx>=8.2.3,<9; python_version >= '3.11' and python_version < '3.13'",
    "sphinx>=7.4.7,<8; python_version < '3.11'",
    "furo>=2025.12.19",
]

[tool.maturin]
python-source = "python"
module-name = "pyjosers._native"
include = [
    { path = "docs/*.rst", format = "sdist" },
    { path = "docs/conf.py", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
    { path = "examples/*.py", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
]
exclude = ["dist/**", "target/**", ".venv/**", "docs/_build/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
