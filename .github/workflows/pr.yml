name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install SoftHSM and OpenSC
        run: sudo apt-get update && sudo apt-get install -y softhsm2 opensc
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade uv
          uv pip install --system -e '.[dev]'
      - name: Check Rust formatting and linting
        run: |
          cargo fmt --check
          cargo clippy --locked --all-features -- -D warnings
      - name: Run tests and executable examples
        run: python -m pytest -q
      - name: Check documentation
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
          sphinx-build -W -b doctest docs docs/_build/doctest
