name: Release to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check package and tag versions
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          rust_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          def literal_assignment(path, name):
              tree = ast.parse(Path(path).read_text())
              for node in tree.body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      return ast.literal_eval(node.value)
              raise SystemExit(f"Missing {name} in {path}")

          runtime_version = literal_assignment("python/pyjosers/__init__.py", "__version__")
          docs_version = literal_assignment("docs/conf.py", "release")
          if len({python_version, rust_version, runtime_version, docs_version}) != 1:
              raise SystemExit("Python, Rust, runtime and documentation versions disagree")
          if os.environ["RELEASE_REF"].startswith("refs/tags/"):
              if os.environ["RELEASE_TAG"] != f"v{python_version}":
                  raise SystemExit("Release tag must match the package version")
          PY

      - uses: dtolnay/rust-toolchain@stable
      - name: Validate the registry lockfile before building distributions
        run: cargo metadata --locked --all-features --format-version 1 > /dev/null

  distributions:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      retention-days: 3

  publish:
    name: Publish tested distributions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/pyjosers
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: pyjosers_*
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
