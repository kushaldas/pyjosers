[package]
name = "pyjosers"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
resolver = "3"
license = "BSD-2-Clause"
description = "Python JOSE bindings powered by jose-rs"
readme = "README.md"
exclude = ["dist/**", "target/**", ".venv/**", "docs/_build/**", "**/__pycache__/**", "python/pyjosers/*.so"]


[project.urls]
Documentation = "https://pyjosers.readthedocs.org/"
Repository = "https://github.com/kushaldas/pyjosers"


[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["post-quantum", "pkcs11"]
post-quantum = ["jose-rs/post-quantum", "kryptering/post-quantum"]
pkcs11 = ["jose-rs/pkcs11", "kryptering/pkcs11"]
legacy = ["jose-rs/deprecated"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py310"] }
jose-rs = { version = "=0.11.0", default-features = false }
kryptering = { version = "0.7.1", default-features = false, features = ["rustcrypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "raw_value"] }
pkcs8 = "0.11.0"
zeroize = "1.9.1"
